<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project: Etch-a-sketch</title>
    <link rel="stylesheet" href="style.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <main>
      <div class="controls">
        <label for="gridCount">Type a number for the grid count</label>
        <input name="gridCount" type="number" max="100" class="input" />
        <button class="createBtn">Create</button>
        <button class="resetBtn">Reset</button>
        <button class="enableRandColorBtn">Randomize Color</button>
        <button class="showGridLines">Toggle Grid Lines</button>
      </div>
      <div class="container"></div>
    </main>
  </body>
</html>
